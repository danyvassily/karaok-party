[workspace]
resolver = "2"
members = [
    "crates/karaok-core",
    "crates/karaok-dsp",
    "crates/karaok-audio",
    "crates/karaok-mic-server",
    "crates/karaok-ai",
    "crates/karaok-db",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Dany Vassily <dany@karaok-party.dev>"]
repository = "https://github.com/danyvassily/karaok-party"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
karaok-core = { path = "crates/karaok-core" }
karaok-dsp = { path = "crates/karaok-dsp" }
karaok-audio = { path = "crates/karaok-audio" }
karaok-mic-server = { path = "crates/karaok-mic-server" }
karaok-ai = { path = "crates/karaok-ai" }
karaok-db = { path = "crates/karaok-db" }

# Core / Async / Serialization
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
dirs = "6"

# Audio & DSP
cpal = "0.15"
ringbuf = "0.4"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "aac", "isomp4", "ogg", "vorbis", "pcm", "opt-simd"] }
rubato = "0.16"
signalsmith-stretch = "0.1"
hound = "3.5"
rustfft = "6"

# Local Mic Server (HTTPS / WSS / mDNS / QR)
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.9", features = ["tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
mdns-sd = "0.13"
qrcode = "0.14"
local-ip-address = "0.6"
futures-util = "0.3"
url = "2"

# Database & HTTP
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Tauri v2
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
